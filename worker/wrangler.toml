# old.datahub.io edge Worker: old-CKAN-URL redirects + proxy to the Arc-hosted export.
# worker/redirect-map.json is generated by `npm run fetch:catalog` (portal root); rebuild
# the portal and redeploy this Worker together so the map matches the export.
name = "old-datahub-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Not attached to old.datahub.io yet. To go live, point the route at the zone (the
# old.datahub.io DNS record must be proxied/orange-cloud), then `npx wrangler deploy`:
# routes = [{ pattern = "old.datahub.io/*", zone_name = "datahub.io" }]
workers_dev = true

[vars]
ARC_ORIGIN = "https://old-datahub.arc.portaljs.com"
CKAN_ORIGIN = "https://api.old.datahub.io"
